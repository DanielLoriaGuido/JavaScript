        //Si bien el codigo anterior es funcional tiene un error que provoca que los divisores se muestren con , incluyendo al ultimo
        
        var number = prompt("変数を入力してください");

        number = parseInt(number);  // Convertir la entrada en un número entero

    　　var divider = "";
    　　var divisors = [];　//creamos un array para guardar los divisores

   　　 // Encontrar los divisores
    　　for (i = 1; i <= number; i++) {
       　　 if (number % i === 0) { // Si el número es divisible por i
         　　   divisors.push(i); // Guardamos los divisores en un array
       　　 }
   　　 }

    　　// Crear la cadena con los divisores separados por coma, sin coma después del último
   　　 divider = divisors.join(",");
