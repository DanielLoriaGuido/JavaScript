<!DOCTYPE html>
<html lang="ja">
<head>

<body>
    <h1>JavaScript実習 <br> BMI 計算</h1>
    <script>
     var 名前 = prompt("名前を入力してください");
 　　var 体重 = prompt("体重 (kg) を入力してください");
 　　var 身長 = prompt("身長　(cm）を入力してください");
     
    let bmi = 体重/(身長*身長);

    alert(名前 + "さんのBMIは " + bmi);
    </script>
    <h2></h2>

</body>
</html>
